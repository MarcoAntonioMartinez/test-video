<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="style.css" rel="stylesheet">
    <title>Camera App</title>
</head>

<body>

    <div class="main">

        <video id="video" autoplay></video>

        <!-- credit, make credit section somewhere i guess at footer -->
        <!-- <a href="https://www.flaticon.com/free-icons/left-arrow" title="left arrow icons">     Left arrow icons created by Arkinasi - Flaticon</a> -->
        <div class="buttons">
            <button id="left" onclick="leftButton()"></button>
            <!-- <img src="./images/left.png"> -->
            <button onclick="captureButton()">Capture</button>

            <button id="right" onclick="rightButton()"></button>
        </div>
        <canvas id="canvas" style="display: none" ;>
        </canvas>

        <img id="photo" src="" alt="Captured Photo" />
        <img id="photo1" src="" alt="Captured Photo" />

    </div>
    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const photo = document.getElementById("photo");
        const photo1 = document.getElementById("photo1");

        

        navigator.mediaDevices
            .getUserMedia({
                video: {
                    facingMode: 'environment'
                }
            })
            .then(function (stream) {
                video.srcObject = stream;
            })
            .catch(function (err) {
                console.error("Error accessing the webcam: " + err);
            });

            const capture = () => {
                canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataURL = canvas.toDataURL("image/png");
            return dataURL;
            };


        const captureButton = () => {
            // canvas.width = video.videoWidth;
            // canvas.height = video.videoHeight;
            // canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            // const dataURL = canvas.toDataURL("image/png");
            // capture()
            photo.src = capture();

           

            //add counter use it to change location (the 0,0 in getcontext) then go from there; possibly need the use of a framework for get and post
        };

         const rightButton = () => {
                photo1.src = capture();
        };

    </script>


</body>

</html>
